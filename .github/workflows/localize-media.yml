name: Import standalone website media
on:
  push:
    branches: [codex/fix-site-images]
    paths:
      - .github/workflows/localize-media.yml
      - scripts/localize-media.py
      - scripts/media-sources.json
permissions:
  contents: write
concurrency:
  group: localize-media-review-branch
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/codex/fix-site-images'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow
      - name: Import and validate original media
        run: python scripts/localize-media.py
      - run: npm ci
      - name: Check, test and build the standalone site
        run: |
          npm test
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
      - name: Commit verified media to review branch only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          test "$TARGET_BRANCH" = "codex/fix-site-images"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media-manifest.json public/images public/videos/features public/downloads public/fonts
          if ! git diff --cached --quiet; then
            git commit -m "Store verified standalone media and fonts in repository"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
